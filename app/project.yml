name: HappyKreations
options:
  bundleIdPrefix: com.happykreations
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  HappyKreations:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HappyKreations/Sources
      - path: HappyKreations/Resources
    resources:
      - HappyKreations/Resources/Assets.xcassets
      - HappyKreations/Resources/Fonts
    info:
      path: HappyKreations/Info.plist
      properties:
        CFBundleDisplayName: HappyKreations
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: ""
        UIAppFonts:
          - Fraunces.ttf
          - Caveat.ttf
        ATSApplicationFontsPath: "."
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Face ID est utilisé pour déverrouiller l'application HappyKreations rapidement."
        NSCalendarsFullAccessUsageDescription: "HappyKreations ajoute les retraits de commandes dans votre Calendrier Apple pour que vous les voyiez sur tous vos appareils."
        NSCalendarsUsageDescription: "HappyKreations ajoute les retraits de commandes dans votre Calendrier Apple pour que vous les voyiez sur tous vos appareils."
        NSRemindersFullAccessUsageDescription: "HappyKreations crée des rappels (ex. \"Commander chez le fournisseur X\") dans votre app Rappels."
        NSRemindersUsageDescription: "HappyKreations crée des rappels (ex. \"Commander chez le fournisseur X\") dans votre app Rappels."
        NSUserActivityTypes:
          - com.apple.corespotlight.searchableitem.action
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.happykreations.app
        # Team de signature Apple Developer (compte josset.julien@icloud.com).
        # Le script dev-setup.sh peut surcharger via ${DEVELOPMENT_TEAM} depuis
        # le trousseau ; sinon on utilise cette valeur par défaut.
        DEVELOPMENT_TEAM: YJ8T34YFZZ
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase
        product: Supabase
      # Le widget est une extension iOS : sans ce filtre, le build macOS
      # tenterait de l'embarquer et échouerait.
      - target: HappyKreationsWidget
        destinationFilters: [iOS]
    entitlements:
      path: HappyKreations/HappyKreations.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.reminders: true
        # Partage des données avec le widget (WidgetBridge écrit dans les
        # UserDefaults de ce groupe).
        com.apple.security.application-groups:
          - group.com.happykreations.app
        # Notifications push distantes. Xcode remplace « development » par
        # « production » à l'archivage avec un profil de distribution.
        aps-environment: development

  # === Widget Extension « Aujourd'hui » ===
  #
  # Affiche les retraits du jour sur l'écran d'accueil. Alimenté par
  # WidgetBridge, qui écrit un résumé dans les UserDefaults de l'App Group
  # partagé à chaque loadAll().
  #
  # Nécessite l'Apple Developer Program (App ID secondaire + App Group), actif
  # depuis juillet 2026.
  HappyKreationsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HappyKreationsWidget
        excludes:
          - "HappyKreationsWidget.entitlements"
          - "Info.plist"
      - path: HappyKreations/Resources/Assets.xcassets
    info:
      path: HappyKreationsWidget/Info.plist
      properties:
        CFBundleDisplayName: "Aujourd'hui"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.happykreations.app.widget
        DEVELOPMENT_TEAM: YJ8T34YFZZ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: HappyKreationsWidget/HappyKreationsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.happykreations.app
